name: e_com
description: Aeritx - Your trusted e-commerce shopping companion

# Remove this line if you wish to publish to pub.dev
publish_to: "none"

version: 1.0.2+10

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ui
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  carousel_slider: ^5.0.0
  shimmer_animation: ^2.2.1
  toggle_switch: ^2.3.0
  flutter_staggered_grid_view: ^0.7.0
  smooth_page_indicator: ^1.2.0
  flutter_animate: ^4.5.0
  flutter_rating_bar: ^4.0.1
  material_design_icons_flutter: ^7.0.7296
  flutter_html: ^3.0.0-beta.2
  pull_to_refresh: ^2.0.0
  lottie: ^3.1.2
  badges: ^3.1.2
  flex_color_scheme: ^8.3.1
  rive: ^0.13.9
  auto_animated_list: ^2.0.0
  animated_onboard:
    path: package/animated_onboard
  hold_on_pop: ^0.0.5
  flutter_form_builder: ^10.2.0
  form_builder_validators: ^11.0.0
  extended_image: ^8.2.1
  pinput: ^5.0.0
  cached_network_image: ^3.3.1
  gap: ^3.0.1
  grouped_list: ^6.0.0
  #state and management
  flutter_hooks: ^0.20.5
  hooks_riverpod: ^2.5.1
  go_router: ^14.2.1
  get_it: ^7.7.0
  #util
  equatable: ^2.0.5
  intl: ^0.20.2
  fpdart: ^1.1.0
  dio: ^5.5.0
  #google_sign_in: ^6.2.1
  flutter_facebook_auth: ^7.1.1
  collection: ^1.18.0
  flutter_inappwebview: ^6.0.0
  url_launcher: ^6.3.0
  internet_connection_checker: ^1.0.0+1
  share_plus: ^10.0.2
  image_picker: ^1.1.2
  toastification: ^2.0.0
  location: ^7.0.0
  geocoding: ^3.0.0
  timeago: ^3.7.0
  # firebase_messaging: ^15.1.0
  # firebase_core: ^3.4.0
  flutter_local_notifications: ^17.2.1
  #data
  shared_preferences: ^2.2.3
  open_filex: ^4.4.0
  file_picker: ^8.0.6
  path_provider: ^2.1.3
  crypto: ^3.0.3
  pointycastle: ^3.7.3
  encrypt: ^5.0.3
  package_info_plus: ^8.0.0
  #log
  pretty_dio_logger: ^1.3.1
  talker_flutter: ^4.1.0
  #payment
  payment_module:
    path: package/payment_module
  esewa_flutter: ^3.0.1
  background_downloader: ^8.5.3
  flutter_parsed_text: ^2.2.1
  buttons_tabbar: ^1.3.13
  flutter_svg: ^2.0.10+1
  intl_utils: ^2.8.7
  vector_graphics: any
  razorpay_flutter: 1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  custom_lint: ^0.7.6
  riverpod_lint: ^2.3.13
  build_runner: ^2.4.12
  flutter_gen_runner: ^5.7.0
  flutter_launcher_icons: ^0.13.1

dependency_overrides:
  webview_flutter_android: ^4.7.0
  web: ^1.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/illustration/
    - assets/logo/
    - assets/icon/
    - assets/lottie/
    - assets/rive/
    - assets/svg/

# TO Generate : flutter packages pub run build_runner build
flutter_gen:
  output: lib/_core/strings/
  line_length: 80
  integrations:
    flutter_svg: true
    lottie: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_logo.jpeg"
  remove_alpha_ios: true

flutter_intl:
  enabled: true
  class_name: TR
  main_locale: en
  arb_dir: lib/_core/l10n/lang
  output_dir: lib/_core/l10n/gen_
